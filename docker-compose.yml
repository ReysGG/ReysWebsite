services:
  app:
    image: reyswebsite:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

  # Calls the AI Studio tick every 5 minutes: publishes scheduled posts + runs due auto-article schedules.
  cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      - app
    env_file:
      - .env.docker
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 60
        while true; do
          curl -fsS -m 60 -H "Authorization: Bearer $${CRON_SECRET}" http://app:3000/api/cron/ai-tick || echo "ai-tick failed"
          echo
          sleep 300
        done
