services:
  app:
    image: reyswebsite:latest
    build:
      context: .
      dockerfile: Dockerfile
      # Public values baked into static pages at build time; read from `--env-file .env.docker`.
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://buildwithreys.com}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-}
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-}
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Local upload storage (images + showcase HTML) when Supabase S3 is not configured.
      - uploads:/app/uploads

  # Self-hosted PostgreSQL. DATABASE_URL/DIRECT_URL in .env.docker point to postgresql://reys:<POSTGRES_PASSWORD>@db:5432/reys
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: reys
      POSTGRES_DB: reys
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reys -d reys"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m

  # Calls the AI Studio tick every 5 minutes: publishes scheduled posts + runs due auto-article schedules.
  cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      - app
    env_file:
      - .env.docker
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 60
        while true; do
          curl -fsS -m 60 -H "Authorization: Bearer $${CRON_SECRET}" http://app:3000/api/cron/ai-tick || echo "ai-tick failed"
          echo
          sleep 300
        done

volumes:
  postgres_data:
  uploads:
